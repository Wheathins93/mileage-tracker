services:
  - type: web
    name: mileage-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.4"
      - key: DB_PATH
        value: /opt/render/data/mileage.db
    disk:
      name: mileage-data
      mountPath: /opt/render/data
      sizeGB: 1
